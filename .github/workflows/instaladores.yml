name: Gerar instaladores

# Roda sozinho a cada envio para a branch main (quando o programa muda)
# ou manualmente pela aba Actions. Testa, gera os instaladores de Windows
# e Mac e publica tudo na página "Releases" do repositório.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - 'public/**'
      - 'electron/**'
      - 'build/**'
      - 'package.json'
      - '.github/workflows/instaladores.yml'

permissions:
  contents: write

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Testes da API (Node)
        run: npm test
      - name: Teste dentro do Electron
        run: |
          npx electron-builder install-app-deps
          ELECTRON_RUN_AS_NODE=1 npx electron test/electron-smoke.js

  windows:
    needs: testes
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Teste dentro do Electron (Windows)
        shell: bash
        run: |
          npx electron-builder install-app-deps
          ELECTRON_RUN_AS_NODE=1 npx electron test/electron-smoke.js
      - name: Gerar instalador do Windows
        run: npx electron-builder --win --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - name: Diagnóstico - instalar e abrir no Windows
        continue-on-error: true
        shell: pwsh
        run: |
          $inst = Get-ChildItem dist/*.exe | Select-Object -First 1
          Start-Process $inst.FullName -ArgumentList '/S' -Wait
          $exe = "$env:LOCALAPPDATA\Programs\Helyx\Helyx.exe"
          $instalado = Test-Path $exe
          if (-not $instalado) { $exe = (Get-ChildItem dist/win-unpacked/*.exe | Select-Object -First 1).FullName }
          # Simula quem tinha a versão "Prontuário Pessoal" (pasta com acento) com dados de verdade
          $antigo = Join-Path $env:APPDATA 'Prontuário Pessoal\dados'
          New-Item -ItemType Directory -Force -Path (Join-Path $antigo 'backups\auto-2026-10-17') | Out-Null
          $env:SAUDE_DATA_DIR = $antigo; node --disable-warning=ExperimentalWarning server/scripts/demo.js; Remove-Item Env:SAUDE_DATA_DIR
          Copy-Item (Join-Path $antigo 'saude.db') (Join-Path $antigo 'backups\auto-2026-10-17\saude.db')
          $p = Start-Process $exe -PassThru
          Start-Sleep -Seconds 25
          $vivo = -not $p.HasExited
          $http = 'sem resposta'
          foreach ($porta in 47321) { try { $r = Invoke-WebRequest "http://127.0.0.1:$porta/" -UseBasicParsing -TimeoutSec 5; $http = "$($r.StatusCode) $(if ($r.Content -match 'Helyx') {'pagina ok'})" } catch { $http = "falhou: $($_.Exception.Message)" } }
          $janelas = (Get-Process Helyx -ErrorAction SilentlyContinue | Where-Object MainWindowTitle | ForEach-Object MainWindowTitle) -join ','
          $log = Get-Content "$env:APPDATA\Helyx\helyx.log" -Raw -ErrorAction SilentlyContinue
          $migrado = Test-Path "$env:APPDATA\Helyx\dados\saude.db"
          $dados = try { (Invoke-WebRequest "http://127.0.0.1:47321/api/exams" -UseBasicParsing -TimeoutSec 5).Content.Length } catch { 'erro' }
          $msg = "instalado=$instalado vivo=$vivo http=$http janelas=[$janelas] migrado=$migrado bytes_exames=$dados`n$log"
          Write-Output $msg
          $enc = $msg -replace '%','%25' -replace "`r",'' -replace "`n",'%0A'
          Write-Output "::warning title=Diagnostico Windows::$enc"
          Stop-Process -Name Helyx -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 3
          Remove-Item "$env:APPDATA\Helyx\helyx.log" -ErrorAction SilentlyContinue
          $p2 = Start-Process $exe -ArgumentList '--compat' -PassThru
          Start-Sleep -Seconds 25
          $janelas2 = (Get-Process Helyx -ErrorAction SilentlyContinue | Where-Object MainWindowTitle | ForEach-Object MainWindowTitle) -join ','
          $log2 = Get-Content "$env:APPDATA\Helyx\helyx.log" -Raw -ErrorAction SilentlyContinue
          $msg2 = "COMPAT vivo=$(-not $p2.HasExited) janelas=[$janelas2]`n$log2"
          Write-Output $msg2
          $enc2 = $msg2 -replace '%','%25' -replace "`r",'' -replace "`n",'%0A'
          Write-Output "::warning title=Diagnostico Windows compat::$enc2"
          Stop-Process -Name Helyx -Force -ErrorAction SilentlyContinue
      - name: Separar o instalador
        shell: bash
        run: |
          mkdir saida
          cp dist/*.exe "saida/Instalar-Helyx-Windows.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: saida/*
          if-no-files-found: error
          # Só serve para passar os arquivos à etapa 'publicar'; o que fica é o Release
          retention-days: 1

  mac:
    needs: testes
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Montar o app para Mac (Intel e chip Apple)
        run: npx electron-builder --mac dir --x64 --arm64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - name: Assinar (ad-hoc) e compactar
        run: |
          mkdir saida
          for d in dist/mac dist/mac-arm64; do
            app=$(ls -d "$d"/*.app)
            codesign --force --deep --sign - "$app"
            codesign --verify --deep "$app"
          done
          ditto -c -k --keepParent "$(ls -d dist/mac-arm64/*.app)" "saida/Helyx-Mac-chip-Apple-M1-a-M4.zip"
          ditto -c -k --keepParent "$(ls -d dist/mac/*.app)" "saida/Helyx-Mac-Intel.zip"
      - name: Diagnóstico - abrir no Mac (chip Apple)
        continue-on-error: true
        run: |
          app=$(ls -d dist/mac-arm64/*.app)
          open "$app"
          sleep 25
          vivo=$(pgrep -f "$app/Contents/MacOS" >/dev/null && echo true || echo false)
          http=$(curl -s -o /tmp/p.html -w "%{http_code}" http://127.0.0.1:47321/ || echo falhou)
          grep -q Helyx /tmp/p.html 2>/dev/null && http="$http pagina ok"
          log=$(cat "$HOME/Library/Application Support/Helyx/helyx.log" 2>/dev/null)
          msg="vivo=$vivo http=$http
          $log"
          echo "$msg"
          enc=$(printf '%s' "$msg" | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
          echo "::warning title=Diagnostico Mac::$enc"
          pkill -f "$app/Contents/MacOS" || true
      - uses: actions/upload-artifact@v4
        with:
          name: mac
          path: saida/*
          if-no-files-found: error
          # Só serve para passar os arquivos à etapa 'publicar'; o que fica é o Release
          retention-days: 1

  publicar:
    needs: [windows, mac]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: arquivos
          merge-multiple: true
      - name: Publicar na página Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=$(node -p "require('./package.json').version")
          TAG="v$VER"
          ls -la arquivos
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" arquivos/* --clobber
          else
            gh release create "$TAG" arquivos/* --target "$GITHUB_SHA" \
              --title "Helyx $VER" --notes-file .github/notas-da-versao.md
          fi
